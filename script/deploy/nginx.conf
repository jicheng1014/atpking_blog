map $arg_page $blog_page { default invalid; "" 1; ~^[1-9][0-9]*$ $arg_page; }
map $arg_month $blog_month { default invalid; "" ""; "~^[0-9]{4}-[0-9]{2}$" $arg_month; }
map $arg_date $blog_date { default invalid; "" ""; "~^[0-9]{4}-[0-9]{2}-[0-9]{2}$" $arg_date; }
# The cookie selects Rails rendering; Rails still verifies the signed session.
map $uri $blog_author_session {
  default "";
  / $cookie_session_id;
  /thoughts $cookie_session_id;
  /thoughts/ $cookie_session_id;
}
server {
  listen 80;
  server_name www.3qruok.com;
  root /site/current;
  charset utf-8;
  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/rss+xml;
  add_header X-Content-Type-Options nosniff always;
  location = /up { access_log off; return 200 "ok\n"; }
  location ~ ^/(admin|session|passwords)(/|$) {
    proxy_pass http://100.64.0.4:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location ~ ^/(robots\.txt|icon\.(png|svg)|404\.html)$ { try_files $uri =404; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location /uploads/ { try_files $uri =404; expires 1d; }
  location /rails/active_storage/ {
    error_page 418 = @webp_image;
    if (-f $request_filename.webp) { return 418; }
    try_files $uri @private_image;
  }
  location @webp_image {
    types { }
    default_type image/webp;
    try_files $uri.webp =404;
  }
  location @private_image {
    proxy_pass http://100.64.0.4:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
  }
  location ~ ^/posts/feed(\.rss)?$ {
    types { }
    default_type application/rss+xml;
    try_files /pages$uri/index.p1.m.d.html =404;
  }
  location ~ /\. { deny all; }
  location @author_page {
    limit_except GET HEAD { deny all; }
    proxy_pass http://100.64.0.4:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header Vary Cookie always;
  }
  location / {
    error_page 418 = @author_page;
    if ($blog_author_session != "") { return 418; }
    types { }
    default_type text/html;
    limit_except GET HEAD { deny all; }
    try_files /pages$uri/index.p$blog_page.m$blog_month.d$blog_date.html =404;
    add_header Cache-Control "public, max-age=60";
    add_header Vary Cookie always;
  }
}
